<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1220">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Kickline Sportsbook</title>
  <meta name="description" content="Bet on football and more with Kickline. 18+ only. Bet responsibly.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Kickline home"><span class="logo" aria-hidden="true">K</span><span>Kickline</span></a>
    <nav id="nav" class="nav" aria-label="Main"></nav>
  </header>
  <div id="banner" class="banner" hidden>Betting is temporarily paused. Your balance is safe.</div>
  <div class="layout">
    <main id="main" tabindex="-1"></main>
    <aside id="slip" class="slip" aria-label="Bet slip">
      <button id="slip-close" class="icon-btn slip-close" aria-label="Close bet slip">×</button>
      <div id="slip-body"></div>
    </aside>
  </div>
  <button id="slip-toggle" class="slip-fab" aria-label="Open bet slip">Bet slip <span id="slip-count" class="badge">0</span></button>
  <footer class="footer">
    <div><strong>18+</strong> · Gambling can be addictive. Please play responsibly.</div>
    <div><a href="#/responsible">Responsible gambling</a> · <a href="#/terms">Terms</a></div>
  </footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Kickline requires JavaScript.</noscript>
</body>
</html>
